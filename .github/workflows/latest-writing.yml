# Keeps the "Latest Writing" list in README.md in sync with the RSS feed at
# yusufondu.com/feed.xml, so nothing here has to be typed by hand.
#
# Note: GitHub disables scheduled workflows in a repository that has had no
# activity for 60 days. If the list ever stops updating, that is why — open the
# Actions tab and re-enable it, or run this workflow manually once.
name: Latest writing

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    name: Pull the latest posts into the README
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://www.yusufondu.com/feed.xml"
          max_post_count: 3
          template: "- [$title]($url)$newline"
          commit_message: "chore: refresh the latest writing list"
          committer_username: "github-actions[bot]"
          committer_email: "41898282+github-actions[bot]@users.noreply.github.com"
